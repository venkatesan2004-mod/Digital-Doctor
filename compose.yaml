services:
  mysql:
    image: mysql:8.0.36
    container_name: digital_doctor_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dev_root_doctor_pw_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_doctor}
      MYSQL_USER: ${MYSQL_USER:-digital_doctor_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-dev_secret_doctor_pw_2026}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    networks:
      - digital_doctor_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  chromadb:
    image: chromadb/chroma:0.5.5
    container_name: digital_doctor_chromadb
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "${CHROMA_PORT:-8001}:8000"
    networks:
      - digital_doctor_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital_doctor_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - app_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - digital_doctor_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital_doctor_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    networks:
      - digital_doctor_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  digital_doctor_net:
    driver: bridge

volumes:
  mysql_data:
    name: digital_doctor_mysql_data
  chroma_data:
    name: digital_doctor_chroma_data
  app_uploads:
    name: digital_doctor_uploads
