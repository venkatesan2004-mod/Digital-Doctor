# ==============================================================================
# DIGITAL DOCTOR COMPOSE PRODUCTION HARDENING OVERRIDES
# Usage: docker compose -f compose.yaml -f compose.prod.yaml up -d
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mysql:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  chromadb:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
